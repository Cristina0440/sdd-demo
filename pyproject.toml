[project]
name = "registro-mensajes-chatbot"
version = "0.1.0"
description = "Servicio REST que registra, consulta y clasifica los mensajes que los alumnos envían al chatbot de ventas de una academia"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "supabase",
    "pydantic",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
